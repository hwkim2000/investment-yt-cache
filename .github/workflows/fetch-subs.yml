name: Fetch YT subtitle URLs

on:
  schedule:
    - cron: "50 21 * * *"  # 06:50 KST (21:50 UTC prior day)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install youtube-transcript-api

      - name: Fetch subtitles (CF Worker + transcript-api fallback)
        run: python fetch_subs.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "chore: daily subtitle URL refresh"
          git push
